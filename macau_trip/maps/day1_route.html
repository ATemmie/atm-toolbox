<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>24日·澳门半岛路线（南→北）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    body { margin: 0; padding: 0; }
    #map { width: 1200px; height: 800px; }
    .num-label {
        background: transparent; color: white; border: none;
        font-size: 14px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        font-family: Arial, sans-serif; padding: 0;
    }
</style></head><body>
<div id="map"></div>
<script>
var map = L.map('map', {zoomControl: true}).setView([22.17135, 113.5468], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
}).addTo(map);

        L.circleMarker([22.1447, 113.5583], {
            radius: 12, fillColor: '#E17055', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('1', {permanent: true, direction: 'center', className: 'num-label'});
        
        L.circleMarker([22.1892, 113.5353], {
            radius: 12, fillColor: '#6C5CE7', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('2', {permanent: true, direction: 'center', className: 'num-label'});
        
        L.circleMarker([22.1788, 113.5438], {
            radius: 12, fillColor: '#00B894', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('3', {permanent: true, direction: 'center', className: 'num-label'});
        
        L.circleMarker([22.174, 113.549], {
            radius: 12, fillColor: '#0984E3', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('4', {permanent: true, direction: 'center', className: 'num-label'});
        
        L.circleMarker([22.192, 113.543], {
            radius: 12, fillColor: '#FDCB6E', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('5', {permanent: true, direction: 'center', className: 'num-label'});
        
        L.circleMarker([22.1945, 113.542], {
            radius: 12, fillColor: '#E17055', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('6', {permanent: true, direction: 'center', className: 'num-label'});
        
        L.circleMarker([22.1972, 113.543], {
            radius: 12, fillColor: '#6C5CE7', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('7', {permanent: true, direction: 'center', className: 'num-label'});
        
        L.circleMarker([22.198, 113.5445], {
            radius: 12, fillColor: '#00B894', color: '#fff', weight: 2, fillOpacity: 0.9
        }).addTo(map).bindTooltip('8', {permanent: true, direction: 'center', className: 'num-label'});
        
L.polyline([[22.1447,113.5583],[22.1892,113.5353],[22.1788,113.5438],[22.174,113.549],[22.192,113.543],[22.1945,113.542],[22.1972,113.543],[22.198,113.5445]], {color: '#E17055', weight: 4, opacity: 0.8, dashArray: '10, 6'}).addTo(map);
map.fitBounds(L.latLngBounds([[22.1447,113.5583],[22.1892,113.5353],[22.1788,113.5438],[22.174,113.549],[22.192,113.543],[22.1945,113.542],[22.1972,113.543],[22.198,113.5445]]).pad(0.1));
</script></body></html>
